# SitePulse NGINX routing
#
# - POST /collect            -> Ingestion Server (high write throughput)
# - everything else under /api -> Dashboard API Server
# - Everything else            -> Standalone Next.js Frontend
#
# Keep this split strict: the ingestion upstream must never see dashboard
# traffic, and vice versa (see ARCHITECTURE.md).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # Protect the ingestion upstream from being overwhelmed while still
    # allowing legitimate burst traffic (e.g. traffic spikes on customer sites).
    limit_req_zone $binary_remote_addr zone=collect_zone:10m rate=20r/s;

    upstream ingestion_upstream {
        least_conn;
        server ingestion-server-1:4001 max_fails=3 fail_timeout=10s;
        server ingestion-server-2:4001 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream dashboard_upstream {
        least_conn;
        server dashboard-server-1:4002 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 64k;

        # ---- Ingestion: SDK event traffic ----
        location = /collect {
            limit_req zone=collect_zone burst=40 nodelay;

            proxy_pass http://ingestion_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        location = /ingestion/healthz {
            proxy_pass http://ingestion_upstream/healthz;
        }

        # ---- Dashboard + auth APIs ----
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
        }

        # ---- Static SDK file (or serve via a CDN in production) ----
        location = /analytics.js {
            root /usr/share/nginx/sdk;
            add_header Cache-Control "public, max-age=300";
            add_header Access-Control-Allow-Origin "*";
        }

        # ---- Standalone Next.js Frontend Deployment Engine Proxy ----
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}

version: "3.9"

services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: sitepulse-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Trace viewer. Jaeger's OTLP receiver accepts spans directly, so no
  # separate OpenTelemetry Collector is needed for this setup.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sitepulse-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI: http://localhost:16686
      - "4318:4318"   # OTLP HTTP receiver
      - "4317:4317"   # OTLP gRPC receiver

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sitepulse-frontend
    env_file: .env
    environment:
      # Use your docker-compose service name block as the domain host target
      - DASHBOARD_API_URL=http://dashboard-server-1:4002
    expose:
      - "3000"
    
  ingestion-server-1:
    build:
      context: .
      dockerfile: apps/ingestion-server/Dockerfile
    container_name: sitepulse-ingestion-1
    env_file: .env
    environment:
      - INGESTION_PORT=4001
      - KAFKA_BROKERS=kafka:9092
      - OTEL_SERVICE_NAME=ingestion-server-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_PROMETHEUS_PORT=9464
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "4001"
      - "9464"

  ingestion-server-2:
    build:
      context: .
      dockerfile: apps/ingestion-server/Dockerfile
    container_name: sitepulse-ingestion-2
    env_file: .env
    environment:
      - INGESTION_PORT=4001
      - KAFKA_BROKERS=kafka:9092
      - OTEL_SERVICE_NAME=ingestion-server-2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_PROMETHEUS_PORT=9464
    depends_on:
      kafka:
        condition: service_healthy
    expose:
      - "4001"
      - "9464"

  dashboard-server-1:
    build:
      context: .
      dockerfile: apps/dashboard-server/Dockerfile
    container_name: sitepulse-dashboard-1
    env_file: .env
    environment:
      - DASHBOARD_PORT=4002
      - OTEL_SERVICE_NAME=dashboard-server-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_PROMETHEUS_PORT=9464
    expose:
      - "4002"
      - "9464"
      
  fastapi-agent:
    build:
      context: ./apps/fastapi-server
      dockerfile: Dockerfile
    container_name: sitepulse-ai-agent
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=fastapi-agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CONSUMER_GROUP=sitepulse-worker
      - OTEL_SERVICE_NAME=worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_PROMETHEUS_PORT=9464
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    container_name: sitepulse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sdk:/usr/share/nginx/sdk:ro
    depends_on:
      - frontend
      - ingestion-server-1
      - ingestion-server-2
      - dashboard-server-1

volumes:
  kafka_data:
